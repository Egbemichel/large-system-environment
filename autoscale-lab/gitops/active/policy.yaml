# CPU policy: Horizontal Pod Autoscaler on average CPU utilization.
# 60% of the 500m request is 300m per pod, which is about 3 requests/s at 100 ms of CPU each.
# The same operating point is used by the keda and predictive policies, so the three
# reactive policies aim at the same load per pod and differ only in signal and timing.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: workload-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workload
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
