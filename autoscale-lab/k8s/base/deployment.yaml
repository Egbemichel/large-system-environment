apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload
  labels:
    app: workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workload
  template:
    metadata:
      labels:
        app: workload
    spec:
      containers:
        - name: app
          image: workload:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Requests equal limits so that one pod has a fixed, known capacity
          # (about 5 requests/s at 100 ms of CPU per request). See notes in the report.
          resources:
            requests:
              cpu: 500m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: workload
  labels:
    app: workload
spec:
  type: NodePort
  selector:
    app: workload
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
